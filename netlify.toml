[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/accueil"
  to = "/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
